# 部署路径：/etc/nginx/conf.d/mcn-platform.conf
# 部署前将 <你的域名> 替换为实际域名

upstream mcn_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name <你的域名>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name <你的域名>;

    # SSL 证书（阿里云证书路径）
    ssl_certificate     /etc/nginx/ssl/mcn-platform.pem;
    ssl_certificate_key /etc/nginx/ssl/mcn-platform.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 静态资源缓存
    location /_next/static/ {
        proxy_pass http://mcn_backend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 主入口
    location / {
        proxy_pass http://mcn_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 流式 AI 输出必须关闭缓冲
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # 上传文件大小限制（文档上传）
    client_max_body_size 20M;

    # 日志
    access_log /var/log/nginx/mcn-platform-access.log;
    error_log  /var/log/nginx/mcn-platform-error.log;
}
